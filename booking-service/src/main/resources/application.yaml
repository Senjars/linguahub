server:
  port: 8082

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.validation: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    io.github.senjar.bookingservice: DEBUG

spring:
  application:
    name: booking-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/linguahub
          jwk-set-uri: http://keycloak:8080/realms/linguahub/protocol/openid-connect/certs
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: booking-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: io.github.senjar.bookingservice.event.PaymentConfirmedEvent
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
