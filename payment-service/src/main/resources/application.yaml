server:
  port: 8083

spring:
  application:
    name: payment-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/linguahub
          jwk-set-uri: http://keycloak:8080/realms/linguahub/protocol/openid-connect/certs
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
eureka:
  client:
    service-url:
        defaultZone: http://localhost:8761/eureka

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  app-url: http://localhost:8080
  success-url: http://localhost:8083/payment/success
  cancel-url: http://localhost:8083/payment/cancel
