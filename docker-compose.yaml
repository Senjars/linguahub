name: linguahub

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

services:
  postgres-users:
    image: postgres:16-alpine
    container_name: linguahub-postgres-users
    environment:
      POSTGRES_DB: ${POSTGRES_USERS_DB}
      POSTGRES_USER: ${POSTGRES_USERS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_USERS_PASSWORD}
    ports:
      - "${POSTGRES_USERS_PORT}:5432"
    volumes:
      - postgres-users-data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    networks:
      - linguahub-network

  postgres-bookings:
    image: postgres:16-alpine
    container_name: linguahub-postgres-bookings
    environment:
      POSTGRES_DB: ${POSTGRES_BOOKINGS_DB}
      POSTGRES_USER: ${POSTGRES_BOOKINGS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_BOOKINGS_PASSWORD}
    ports:
      - "${POSTGRES_BOOKINGS_PORT}:5432"
    volumes:
      - postgres-bookings-data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    networks:
      - linguahub-network

  postgres-payments:
    image: postgres:16-alpine
    container_name: linguahub-postgres-payments
    environment:
      POSTGRES_DB: ${POSTGRES_PAYMENTS_DB}
      POSTGRES_USER: ${POSTGRES_PAYMENTS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PAYMENTS_PASSWORD}
    ports:
      - "${POSTGRES_PAYMENTS_PORT}:5432"
    volumes:
      - postgres-payments-data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    networks:
      - linguahub-network

  postgres-keycloak:
    image: postgres:16-alpine
    container_name: linguahub-postgres-keycloak
    environment:
      POSTGRES_DB: ${POSTGRES_KEYCLOAK_DB}
      POSTGRES_USER: ${POSTGRES_KEYCLOAK_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck
    networks:
      - linguahub-network

  discovery-server:
    image: discovery-server:latest
    container_name: linguahub-discovery-server
    build:
      context: ./discovery-server
    ports:
      - "${DISCOVERY_SERVER_PORT}:8761"
    restart: on-failure
    networks:
      - linguahub-network

  api-gateway:
    image: api-gateway:latest
    container_name: linguahub-api-gateway
    build:
      context: ./api-gateway
    ports:
      - "${API_GATEWAY_PORT}:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_started
      user-service:
        condition: service_started
      booking-service:
        condition: service_started
      payment-service:
        condition: service_started
    restart: on-failure
    networks:
      - linguahub-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: linguahub-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/${POSTGRES_KEYCLOAK_DB}
      KC_DB_USERNAME: ${POSTGRES_KEYCLOAK_USER}
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    ports:
      - "${KEYCLOAK_PORT}:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/linguahub-realm.json:ro
    networks:
      - linguahub-network

  user-service:
    image: user-service:latest
    container_name: linguahub-user-service
    build:
      context: ./user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-users:5432/${POSTGRES_USERS_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USERS_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_USERS_PASSWORD}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    depends_on:
      postgres-users:
        condition: service_healthy
      discovery-server:
        condition: service_started
    restart: on-failure
    networks:
      - linguahub-network

  booking-service:
    image: booking-service:latest
    container_name: linguahub-booking-service
    build:
      context: ./booking-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-bookings:5432/${POSTGRES_BOOKINGS_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_BOOKINGS_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_BOOKINGS_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    depends_on:
      postgres-bookings:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - linguahub-network

  payment-service:
    image: payment-service:latest
    container_name: linguahub-payment-service
    build:
      context: ./payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payments:5432/${POSTGRES_PAYMENTS_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_PAYMENTS_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PAYMENTS_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      postgres-payments:
        condition: service_healthy
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - linguahub-network

  notification-service:
    image: notification-service:latest
    container_name: linguahub-notification-service
    build:
      context: ./notification-service
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - linguahub-network

  kafka:
    image: apache/kafka:latest
    container_name: linguahub-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks:
      - linguahub-network

networks:
  linguahub-network:
    driver: bridge

volumes:
  postgres-users-data:
  postgres-bookings-data:
  postgres-payments-data:
  postgres-keycloak-data: